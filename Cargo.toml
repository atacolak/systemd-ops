[package]
name = "systemd-ops"
version = "0.7.0"
edition = "2021"
# Verified in CI, both directions: 1.82 builds, 1.81 does not, because
# Option::is_none_or stabilized in 1.82.
rust-version = "1.82"
description = "Inspect, control, and author systemd operations. Direct CLI by default; optional MCP frontend. Writes only through plan/apply."
license = "MIT"
readme = "README.md"
keywords = ["systemd", "journald", "sysadmin", "mcp"]
categories = ["command-line-utilities", "os::linux-apis"]
authors = ["Robert Haist <rhaist@mailbox.org>", "contributors"]
# The published crate is the buildable source and its documentation.
# Live suites, GitHub workflows, and the OMP adapter live in git.
exclude = ["/tests", "/.github", "/omp"]

[lib]
name = "systemd_ops"
path = "src/lib.rs"

[[bin]]
name = "systemd-ops"
path = "src/bin/systemd_ops.rs"

[[bin]]
name = "systemd-ops-mcp"
path = "src/bin/systemd_ops_mcp.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
